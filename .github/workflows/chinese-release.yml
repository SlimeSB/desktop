name: Chinese Release

on:
  push:
    tags:
      - 'zh-v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: 24.22.1
  DESKTOP_LOCALE: zh-CN

jobs:
  verify:
    name: Verify locale
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: node vendor/yarn-1.21.1.js install --frozen-lockfile
      - name: Regenerate baseline locale
        run: node script/i18n/extract.js
      - name: Fail on uncommitted baseline drift
        run: git diff --exit-code app/locales/en.json
      - name: Check translation coverage
        run: node script/i18n/check.js --strict

  release:
    name: Build and publish
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: node vendor/yarn-1.21.1.js install --frozen-lockfile
      - name: Build Chinese app
        run: node vendor/yarn-1.21.1.js build:prod
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./app/package.json').version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Archive app
        shell: pwsh
        run: |
          $name = "GitHubDesktop-zh-CN-${{ steps.version.outputs.version }}-win32-x64"
          Compress-Archive -Path "dist/GitHubDesktop-win32-x64" -DestinationPath "$name.zip"
          echo "ARCHIVE=$name.zip" >> $env:GITHUB_ENV
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('zh-v{0}', steps.version.outputs.version) }}
          name: 中文版 ${{ steps.version.outputs.version }}
          body: "基于上游 desktop/desktop 构建的简体中文界面版本，功能未改动，解压运行 GitHubDesktop.exe，未签名构建可能触发 SmartScreen 提示。"
          files: ${{ env.ARCHIVE }}
          draft: false
          prerelease: false
